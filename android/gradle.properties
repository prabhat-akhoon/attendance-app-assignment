org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9's unified built-in Kotlin compiler — resolves each module's Kotlin
# jvmTarget consistently from its own Java compileOptions, instead of the
# old external Kotlin Gradle Plugin path where plugin subprojects (e.g.
# tflite_flutter, google_mlkit_commons) that don't declare their own
# Kotlin target drift to whatever JDK is running Gradle, mismatching their
# explicit (lower) Java target and failing the build.
android.builtInKotlin=true
